<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Manager</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #f4f4f4;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    background: white;
    width: 90%;
    max-width: 380px;
    padding: 35px 25px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 5px 25px #00000012;
}

.logo {
    font-size: 55px;
    margin-bottom: 15px;
}

h1 {
    font-size: 26px;
    color: #111;
    margin-bottom: 12px;
}

p {
    color: #777;
    font-size: 14px;
    margin-bottom: 28px;
}

button {
    width: 100%;
    padding: 16px;
    background: #111;
    color: white;
    border: none;
    border-radius: 9px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

#status {
    margin-top: 20px;
    font-size: 13px;
    color: #777;
}
</style>
</head>

<body>

<div class="card">
    <div class="logo">📸</div>

    <h1>Photo Manager</h1>

    <p>Manage and check your photos easily.</p>

    <button onclick="checkPhoto()">
        CHECK YOUR PHOTO
    </button>

    <div id="status">Ready to check your photos.</div>
</div>

<audio id="prankSound" src="sound.mp3" preload="auto"></audio>

<script>
function checkPhoto() {
    const sound = document.getElementById("prankSound");
    const status = document.getElementById("status");

    sound.currentTime = 0;

    sound.play()
    .then(() => {
        status.innerText = "Checking your photos...";
    })
    .catch(() => {
        status.innerText = "Sound file not found. Please add sound.mp3.";
    });
}
</script>

</body>
</html>
